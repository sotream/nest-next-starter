packages:
  - apps/*

# Install scripts are skipped on purpose: scarf is analytics only, unrs-resolver ships prebuilt binaries.
# New packages with build scripts fail install until reviewed.
allowBuilds:
  '@scarf/scarf': false
  unrs-resolver: false

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - '@next/env@16.4.0'
  - '@next/swc-darwin-arm64@16.4.0'
  - '@next/swc-darwin-x64@16.4.0'
  - '@next/swc-linux-arm64-gnu@16.4.0'
  - '@next/swc-linux-arm64-musl@16.4.0'
  - '@next/swc-linux-x64-gnu@16.4.0'
  - '@next/swc-linux-x64-musl@16.4.0'
  - '@next/swc-win32-arm64-msvc@16.4.0'
  - '@next/swc-win32-x64-msvc@16.4.0'
  - next@16.4.0
  - '@next/eslint-plugin-next@16.4.0'
  - eslint-config-next@16.4.0
